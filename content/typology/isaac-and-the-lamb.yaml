title: Isaac and the Lamb
summary: In Genesis 22 Abraham offers Isaac, his only son, and God provides a ram in Isaac’s place. The New Testament does not name the episode a type of Christ, but Hebrews says that, figuratively, Abraham received Isaac back from the dead, and Paul’s words that God did not spare His own Son echo the chapter.
