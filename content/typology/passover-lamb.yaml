title: The Passover Lamb
summary: "On the night of the exodus Israel sacrificed unblemished lambs, and the LORD passed over the houses marked with their blood. The New Testament names Christ our Passover lamb: He died at Passover, not one of His bones was broken, and His people are redeemed by His precious blood, as of a lamb without blemish."
