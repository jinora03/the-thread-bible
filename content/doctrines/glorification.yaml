title: Glorification
category: Salvation & Last Things
summary: Those whom God justified He also glorified (Romans 8:30). When Christ appears, His people will be raised or changed, given bodies like His glorious body, and they will be like Him (1 Corinthians 15:51–53; Philippians 3:20–21; 1 John 3:2).
