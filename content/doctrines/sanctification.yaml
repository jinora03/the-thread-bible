title: Sanctification
category: Salvation
summary: God’s will for His people is their holiness (1 Thessalonians 4:3). Those who belong to Christ walk by the Spirit, put to death the deeds of the body, and are being transformed into His image from one degree of glory to another (Romans 8:4, 13; 2 Corinthians 3:18).
