title: God the Creator
category: God & Creation
summary: "God created all things by His command and declared what He had made very good (Genesis 1:1, 31). The rest of Scripture returns to this foundation: the heavens were made by His word, all things were made through the Son, and He is worthy of worship as Creator (Psalm 33:6; Colossians 1:16–17; Revelation 4:11)."
