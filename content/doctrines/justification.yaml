article:
  keyScriptures:
    - Ephesians 2:8–10
    - Romans 3:21–28
    - Romans 5:1
    - Titus 3:4–7
    - John 3:16
    - Acts 16:30–31
  teaching:
    - "No one is declared righteous by keeping the law, for all have sinned and fall short of the glory of God ([[Romans 3:20–23]]). Justification begins with God. He so loved the world that He gave His Son ([[John 3:16]]), and He justifies sinners freely by His grace, through the redemption that is in Christ Jesus, whom He put forward as an [[doctrine:atonement|atoning sacrifice]] by His blood ([[Romans 3:24–25]]). He saves not because of righteous things we have done but because of His mercy ([[Titus 3:4–7]])."
    - "This righteousness is received through faith, apart from works, so boasting is excluded ([[Romans 3:27–28]]). When the jailer at Philippi asked what he must do to be saved, he was told to believe in the Lord Jesus ([[Acts 16:30–31]]), and those justified by faith have peace with God ([[Romans 5:1]]). Good works are not the price of salvation but the life that follows it: believers are God’s workmanship, created in Christ Jesus for good works that He prepared beforehand ([[Ephesians 2:8–10]])."
  foundation:
    oldTestament:
      - "[[Genesis 15:6]]: Abraham believed the Lord, and He counted it to him as righteousness. Paul builds on this verse in [[Romans 4:3]] and [[Galatians 3:6]]."
      - "[[Psalm 32:1–2]]: blessed is the one whose sin is forgiven and to whom the Lord does not count iniquity. Paul cites it in [[Romans 4:6–8]]."
      - "[[Psalm 143:2]]: no one living is righteous before God, words Paul echoes in [[Romans 3:20]] and [[Galatians 2:16]]."
      - "[[Isaiah 53:11]]: the righteous Servant will justify many, for He will bear their iniquities."
      - "[[Habakkuk 2:4]]: the righteous will live by faith, quoted in [[Romans 1:17]] and [[Galatians 3:11]]."
    newTestament:
      - "[[Luke 18:9–14]]: the tax collector who pleads for mercy, not the Pharisee who lists his deeds, goes home justified."
      - "[[Romans 4:25]]: Jesus was delivered up for our trespasses and raised for our justification."
      - "[[Romans 5:8–9]]: while we were still sinners Christ died for us, and we are now justified by His blood."
      - "[[2 Corinthians 5:21]]: God made Him who knew no sin to be sin for us, so that in Him we might become the righteousness of God."
      - "[[Galatians 2:16]]: a person is justified not by works of the law but through faith in Jesus Christ."
      - "[[Philippians 3:8–9]]: Paul counts everything loss to be found in Christ, with a righteousness not his own but from God through faith."
  insights:
    - title: Paul and James on Abraham
      body: "Paul and James both quote [[Genesis 15:6]]. Paul shows that Abraham was counted righteous by faith before he had done any work ([[Romans 4:1–10]]), and James shows that the same faith was active along with his works when he offered Isaac, for faith without works is dead ([[James 2:17–24]])."
    - title: Saved by mercy, devoted to good works
      body: "Titus 3 holds both together. God saved us not by works of righteousness but by His mercy, and those who have believed are to be careful to devote themselves to good works ([[Titus 3:5–8]])."
    - title: Fruit from the vine
      body: "Jesus tells His disciples they are already clean because of His word, then calls them to abide in Him and bear much fruit ([[John 15:3–5]]). A branch that does not abide is thrown away, and by bearing much fruit His disciples glorify the Father ([[John 15:6–8]])."
    - title: No charge can stand
      body: "Because God is the one who justifies, no accusation can stand against His people, for Christ who died and was raised intercedes for them ([[Romans 8:33–34]])."
  questions:
    - question: How can a person be righteous before God?
      answer:
        - "Job asks it ([[Job 9:2]]), and so does his friend Bildad ([[Job 25:4]]). Paul answers that God is both just and the justifier of the one who has faith in Jesus ([[Romans 3:26]]), counting faith as righteousness for the one who trusts Him who justifies the ungodly ([[Romans 4:5]])."
    - question: Shall we go on sinning so that grace may increase?
      answer:
        - "Paul raises this question himself and rejects it outright ([[Romans 6:1–2]]). Those who are justified have been united with Christ in His death and resurrection, so they walk in newness of life ([[Romans 6:3–4]]) and have become servants of righteousness ([[Romans 6:17–18]])."
