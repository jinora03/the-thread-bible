title: Justification
category: Salvation
summary: Justification is God’s declaration that a sinner is righteous in His sight. It originates in His grace, rests on the saving work of Jesus Christ, and is received through faith rather than earned by works. The life that follows is one of good works prepared for the believer to walk in (Ephesians 2:10).
