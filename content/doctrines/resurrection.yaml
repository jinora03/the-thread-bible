title: The Resurrection
category: Christ & Last Things
summary: Christ died for our sins, was buried, and was raised on the third day according to the Scriptures (1 Corinthians 15:3–4). He is the firstfruits of those who have died, and at His coming those who belong to Him will be raised (1 Corinthians 15:20–23).
