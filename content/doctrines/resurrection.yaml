article:
  keyScriptures:
    - 1 Corinthians 15:3–8
    - Luke 24:36–43
    - 1 Corinthians 15:20–23
    - John 11:25–26
    - Daniel 12:2
  teaching:
    - "Christ died for our sins, was buried, and was raised on the third day according to the Scriptures. He then appeared to Peter, to the Twelve, and to more than five hundred at once ([[1 Corinthians 15:3–8]]). The risen Jesus was not a spirit: He showed His hands and feet, invited His disciples to touch Him, and ate in front of them ([[Luke 24:36–43]])."
    - "His resurrection is the firstfruits of a greater harvest: those who belong to Christ will be raised at His coming ([[1 Corinthians 15:20–23]]). Jesus calls Himself [[John 11:25–26|the resurrection and the life]], and Scripture looks to a day when all the dead are raised, some to everlasting life and some to judgment ([[Daniel 12:2]]; [[John 5:28–29]])."
  foundation:
    oldTestament:
      - "[[Job 19:25–27]]: in his suffering, Job trusts that his Redeemer lives and that he will see God."
      - "[[Psalm 16:10]]: God will not abandon His Holy One to the grave. Peter and Paul both apply the psalm to Jesus ([[Acts 2:25–31]]; [[Acts 13:35–37]])."
      - "[[Isaiah 25:8]] and [[Isaiah 26:19]]: the Lord will swallow up death forever, and the dead will rise. Paul cites the first in [[1 Corinthians 15:54]]."
      - "[[Hosea 13:14]]: God challenges death and the grave, words Paul takes up in [[1 Corinthians 15:55]]."
      - "[[Daniel 12:2]]: many who sleep in the dust will awake, some to everlasting life and some to everlasting contempt. It is the clearest Old Testament statement of the resurrection."
    newTestament:
      - "[[Mark 8:31]]: Jesus teaches that He must suffer, be killed, and rise after three days."
      - "[[Matthew 28:5–7]]: at the empty tomb the angel announces that Jesus has risen, as He said."
      - "[[Acts 2:24]]: God raised Jesus, because it was not possible for death to hold Him, and the apostles are His witnesses ([[Acts 2:32]])."
      - "[[Romans 8:11]]: the Spirit who raised Jesus from the dead will also give life to the mortal bodies of those in whom He dwells."
      - "[[1 Peter 1:3]]: God has given His people new birth into a living hope through the resurrection of Jesus Christ."
      - "[[Revelation 1:17–18]]: the risen Christ was dead and is alive forevermore, and He holds the keys of death and Hades."
  insights:
    - title: It is of first importance
      body: "Paul places the resurrection beside the cross at the heart of the gospel. If Christ has not been raised, faith is futile and believers are still in their sins ([[1 Corinthians 15:14–17]])."
    - title: Jesus is Lord and Christ
      body: "God raised the One who was crucified and made Him both Lord and Christ ([[Acts 2:32–36]]). By the resurrection He was declared to be the Son of God in power ([[Romans 1:4]])."
    - title: Raised for our justification
      body: "Jesus was delivered up for our trespasses and raised for our [[doctrine:justification|justification]] ([[Romans 4:25]]). United with Him, believers now walk in newness of life ([[Romans 6:4–5]])."
    - title: Death is defeated
      body: "Death is the last enemy to be destroyed ([[1 Corinthians 15:26]]). Paul answers it with the words of Isaiah and Hosea, and gives thanks for the victory God gives through Christ ([[1 Corinthians 15:54–57]])."
  questions:
    - question: How are the dead raised, and with what kind of body?
      answer:
        - "Paul asks this himself ([[1 Corinthians 15:35]]) and answers with a seed: what is sown is not the plant that will be, yet the plant comes from the seed ([[1 Corinthians 15:36–38]]). The body is sown perishable and raised imperishable, sown in weakness and raised in power, sown a natural body and raised a spiritual body ([[1 Corinthians 15:42–44]]). Believers will bear the image of the man of heaven ([[1 Corinthians 15:49]]), and Christ will make their bodies like His glorious body ([[Philippians 3:21]])."
        - "The risen Jesus shows what this means. He could be touched and He ate with His disciples ([[Luke 24:39–43]]), yet He came and stood among them when the doors were shut ([[John 20:19]])."
    - question: What does “firstfruits” mean?
      answer:
        - "In Israel’s worship the first sheaf of the harvest was brought to the priest and waved before the Lord ([[Leviticus 23:10–11]]). Paul calls the risen Christ the firstfruits ([[1 Corinthians 15:20–23]]): His resurrection is the first of the harvest, and those who belong to Him will be raised at His coming."
    - question: What about believers who die before Christ returns?
      answer:
        - "Paul writes so that believers will not grieve as those who have no hope. Those who have fallen asleep in Jesus will rise first when the Lord comes, and so all His people will be with the Lord ([[1 Thessalonians 4:13–17]]). Until then, to depart is to be with Christ, which is far better ([[Philippians 1:21–23]]; [[2 Corinthians 5:6–8]])."
