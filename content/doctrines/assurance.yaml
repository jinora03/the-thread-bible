title: Assurance
category: Salvation
summary: Those who believe in the name of the Son of God may know that they have eternal life (1 John 5:13). The Spirit bears witness that they are God’s children, and nothing in all creation can separate them from the love of God in Christ Jesus (Romans 8:16, 38–39).
