title: The Atonement
category: Salvation
summary: Christ suffered once for sins, the righteous for the unrighteous, to bring us to God (1 Peter 3:18). Scripture describes His death as a sacrifice for sin, a ransom for many, and the bearing of our sins in His body, so that sinners are reconciled to God (Isaiah 53:5; Mark 10:45; 1 Peter 2:24; 2 Corinthians 5:18–21).
