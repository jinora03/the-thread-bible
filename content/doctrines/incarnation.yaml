title: The Incarnation
category: Christ
summary: The Word who was with God and was God became flesh and lived among us (John 1:1, 14). Being in the form of God, the Son took the form of a servant and shared our flesh and blood, so that through His death He might set His people free (Philippians 2:6–7; Hebrews 2:14–15).
