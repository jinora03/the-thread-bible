title: The Abrahamic Covenant
summary: God makes a covenant with Abraham, promising him offspring, the land of Canaan and blessing for all the families of the earth, and He gives circumcision as its sign. Paul states that the promise was made to Abraham and to his offspring, who is Christ, and that all who belong to Christ are Abraham’s offspring and heirs.
