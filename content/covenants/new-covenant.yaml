title: The New Covenant
summary: "Through Jeremiah, God promises a new covenant: He will write His law on His people’s hearts, all will know Him, and He will remember their sins no more. At the Last Supper Jesus calls the cup the new covenant in His blood, and Hebrews quotes Jeremiah’s promise to show that Christ is the mediator of this better covenant."
