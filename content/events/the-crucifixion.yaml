title: The Crucifixion
summary: Jesus was crucified under Pontius Pilate outside Jerusalem at the time of the Passover, and all four Gospels recount His death in detail. The Gospel writers note Scripture being fulfilled at the cross, and the apostles proclaim that Christ died for our sins according to the Scriptures.
