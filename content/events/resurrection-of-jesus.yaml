title: The Resurrection of Jesus
summary: On the first day of the week the tomb was found empty, and the risen Jesus appeared to the women, to His disciples and to many others. The apostles proclaimed that God raised Him on the third day according to the Scriptures, making Him the firstfruits of those who will be raised.
