title: The Binding of Isaac
summary: God tested Abraham by commanding him to offer Isaac, his only son, in the land of Moriah; at the last moment He provided a ram in Isaac’s place and renewed His promise to bless the nations through Abraham’s offspring. Hebrews and James both point to the event as an example of Abraham’s faith.
