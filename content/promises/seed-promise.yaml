title: The Promised Seed
summary: The promise of an offspring begins in Genesis 3:15, where the woman’s offspring will crush the serpent’s head, and is carried forward in God’s promises to Abraham and to David. Paul states that the offspring promised to Abraham is Christ, and he preaches that from David’s offspring God has brought Israel a Savior, Jesus, as He promised.
