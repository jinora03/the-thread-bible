title: Blessing to the Nations
summary: God promises Abraham that all the families of the earth will be blessed in him. Paul calls this the gospel preached beforehand to Abraham, fulfilled as the nations are justified by faith in Christ, and Revelation shows a multitude from every nation standing before the throne.
keyReferences:
  - Genesis 12:3
  - Galatians 3:8–9
  - Genesis 22:18
  - Isaiah 49:6
  - Acts 3:25–26
  - Matthew 28:18–20
  - Revelation 7:9–10
