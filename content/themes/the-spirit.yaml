title: The Spirit
summary: The Spirit of God hovers over the waters at creation, comes upon prophets and kings, and is promised to be poured out on all flesh. Peter proclaims that promise fulfilled at Pentecost, and in Romans 8 the Spirit gives life, leads God’s children, bears witness with them and intercedes for them.
