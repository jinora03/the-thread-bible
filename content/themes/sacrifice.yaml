title: Sacrifice
summary: From the Passover to the Day of Atonement, God provides sacrifices through which sin is covered and His people draw near to Him. Hebrews calls these a shadow and presents Christ’s death as the one sacrifice, offered once for all, that takes away sin as the blood of animals never could.
