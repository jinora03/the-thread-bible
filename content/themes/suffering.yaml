title: Suffering
summary: "Scripture speaks honestly about suffering: Job grieves, the psalmists lament, and Isaiah’s servant is a man of sorrows. Christ suffered for His people, leaving them an example, and Paul sets the sufferings of this present time against the glory that will be revealed."
