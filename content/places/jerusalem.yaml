title: Jerusalem
region: Judah
summary: Jerusalem is the city David took and made his capital, where Solomon built the temple and the LORD chose to put His name. There Jesus was crucified and raised, and from there the apostles began to proclaim repentance and forgiveness of sins to all nations.
