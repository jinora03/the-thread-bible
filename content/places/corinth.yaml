title: Corinth
region: Achaia
summary: Corinth was a busy port city of Roman Greece, where Paul stayed a year and six months and a church was planted. His letters to the believers there address division and disorder, and in 1 Corinthians 15 he answers some who said there is no resurrection of the dead.
