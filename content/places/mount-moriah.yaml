title: Mount Moriah
region: Judah
summary: God sent Abraham to a mountain in the land of Moriah to offer Isaac, and there He provided a ram in Isaac’s place; Abraham named the place for the LORD’s provision. Scripture uses the name once more, for the mountain in Jerusalem where Solomon built the temple.
