intro:
  - Promises made early in Scripture are remembered, repeated and kept. This study follows one line of promise from Eden to the empty tomb, letting each passage lead to the next.
  - Each part begins with a passage. Read it first; the notes then show where Scripture takes it up again.
sections:
  - id: the-first-promise
    title: The First Promise
    passage: Genesis 3:15
    body:
      - "After the fall, God tells the serpent that there will be enmity between its offspring and the woman’s, ending in a blow to the serpent’s head and a wound to the heel ([[Genesis 3:15]]). The first word of hope comes in the middle of judgment ([[Genesis 3:14–19]])."
      - "The verse does not yet name the deliverer, but Scripture follows the woman’s offspring from here (see [[promise:seed-promise|the promised seed]]). Revelation names the ancient serpent as the devil ([[Revelation 12:9]]). Hebrews says the Son shared our flesh and blood so that through death He might destroy the devil ([[Hebrews 2:14–15]]), and Paul echoes Genesis when he writes that God will soon crush Satan under His people’s feet ([[Romans 16:20]])."
  - id: a-blessing-for-all-nations
    title: A Blessing for All Nations
    passage: Genesis 12:1–3
    body:
      - "God calls Abram to leave his country and promises him a land, a great nation and a great name, so that in him all the families of the earth will be blessed ([[Genesis 12:1–3]]). The promise is repeated to Abraham, Isaac and Jacob ([[Genesis 22:18]]; [[Genesis 26:4]]; [[Genesis 28:14]])."
      - "Paul calls this promise the gospel announced to Abraham in advance ([[Galatians 3:8]]). He identifies the promised seed as Christ ([[Galatians 3:16]]), and says that all who belong to Christ are Abraham’s offspring and heirs ([[Galatians 3:29]]). Peter makes the same connection in Jerusalem ([[Acts 3:25–26]]). Here the New Testament states the link directly."
  - id: the-lamb-god-provides
    title: The Lamb God Provides
    passage: Genesis 22:7–8
    body:
      - "God tells Abraham to offer Isaac, the son through whom the promised offspring would come ([[Genesis 21:12]]). On the way up the mountain Isaac asks where the lamb is, and Abraham answers that God will provide ([[Genesis 22:7–8]]). The angel of the LORD stops Abraham’s hand, a ram is offered in Isaac’s place, and Abraham names the place for what the LORD provided there ([[Genesis 22:11–14]])."
      - "God then confirms His promise with an oath ([[Genesis 22:16–18]]; [[Hebrews 6:13–18]]). Hebrews presents Abraham’s obedience as faith that God could raise the dead ([[Hebrews 11:17–19]]), and Paul’s words about the Father who did not spare His own Son echo this chapter ([[Romans 8:32]])."
      - "Genesis does not itself make the link to Christ, but the pattern of a beloved son offered and a lamb provided by God prepares the reader for John’s words, “Behold the Lamb of God” ([[John 1:29]]). See [[typology:isaac-and-the-lamb]]."
  - id: a-throne-for-ever
    title: A Throne for Ever
    passage: 2 Samuel 7:12–13
    body:
      - "Through the prophet Nathan, God promises David an offspring whose throne He will establish for ever ([[2 Samuel 7:12–16]]). The line of promise has narrowed: from Abraham, to the tribe of Judah ([[Genesis 49:10]]), to the house of David."
      - "Solomon builds the temple, but the promise reaches beyond him. The Psalms and the Prophets look for a greater son of David ([[Psalm 89:3–4]]; [[Isaiah 9:6–7]]; [[Jeremiah 23:5–6]]). The New Testament opens by naming Jesus the son of David, the son of Abraham ([[Matthew 1:1]]). The angel tells Mary that God will give her Son the throne of His father David ([[Luke 1:32–33]]), and Peter preaches the resurrection as God keeping His oath to David ([[Acts 2:29–36]]). See [[covenant:davidic]]."
  - id: the-servant-who-suffers
    title: The Servant Who Suffers
    passage: Isaiah 53:4–6
    body:
      - "Isaiah’s servant is despised and rejected, yet He is wounded for the transgressions of others, and the LORD lays on Him the iniquity of us all ([[Isaiah 53:3–6]]). He goes silently to death, like a lamb led to the slaughter ([[Isaiah 53:7]]), and after His suffering He is exalted ([[Isaiah 52:13]]; [[Isaiah 53:10–12]])."
      - "The New Testament identifies the servant as Jesus. On the night before the cross, Jesus applies the song to Himself ([[Luke 22:37]]). Philip begins from this passage and tells an Ethiopian official the good news about Jesus ([[Acts 8:30–35]]), and Peter uses its words to describe the cross ([[1 Peter 2:22–25]]). See [[prophecy:suffering-servant]]."
  - id: yea-and-amen
    title: Yea and Amen
    passage: 2 Corinthians 1:20
    body:
      - "Paul sums up the gospel he received: Christ died for our sins and was raised on the third day, according to the Scriptures ([[1 Corinthians 15:3–4]]). After His resurrection, Jesus Himself opened the Scriptures to show that the Christ must suffer and rise ([[Luke 24:25–27]]; [[Luke 24:44–47]])."
      - "Paul’s conclusion is that every promise of God finds its yes in Christ ([[2 Corinthians 1:20]]). His resurrection is the firstfruits of the harvest still to come ([[1 Corinthians 15:20–23]]), and Scripture closes where the thread began, with the devil defeated ([[Revelation 20:10]]) and all things made new ([[Revelation 21:1–5]])."
