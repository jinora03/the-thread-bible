  note: Sample content written for the design preview; not yet theologically reviewed.
overview: God tests Abraham by commanding him to offer Isaac, the son through whom the promise was to come. Abraham obeys, the angel of the LORD stops his hand, and God provides a ram in Isaac’s place. God then confirms His promise with an oath, and the New Testament returns to the chapter for Abraham’s faith, God’s unchanging oath, the promised seed, and the Father who did not spare His own Son.
