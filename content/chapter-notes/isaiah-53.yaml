book: isaiah
chapter: 53
title: The suffering servant
review:
  status: in-review
  authors:
    - The Thread Bible editors
  reviewers: []
  note: Sample content written for the design preview; not yet theologically reviewed.
overview: "Isaiah 53 is the heart of the fourth Servant Song ([[Isaiah 52:13–53:12]]). The LORD’s servant is despised and rejected, wounded for the transgressions of others, silent like a lamb led to the slaughter, and buried with the wicked and the rich, yet after His suffering He sees His offspring and is exalted. The New Testament returns to this chapter again and again to explain the death of Jesus, and identifies Him as the servant."
