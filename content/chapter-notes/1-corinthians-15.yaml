book: 1-corinthians
chapter: 15
title: The resurrection
review:
  status: in-review
  authors:
    - The Thread Bible editors
  reviewers: []
  note: Sample content written for the design preview; not yet theologically reviewed.
overview: "Writing to a church where some denied the resurrection of the dead, Paul begins with the gospel he received: Christ died for our sins, was buried, and was raised on the third day according to the Scriptures. Christ’s resurrection is the firstfruits of the harvest to come, and as the last Adam He gives life to all who belong to Him. The chapter draws on the first Adam, the firstfruits offering, the psalms that put every enemy under the Messiah’s feet, and the prophets’ promise that death will be swallowed up in victory."
