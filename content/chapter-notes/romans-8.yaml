book: romans
chapter: 8
title: Life in the Spirit
review:
  status: in-review
  authors:
    - The Thread Bible editors
  reviewers: []
  note: Sample content written for the design preview; not yet theologically reviewed.
overview: "Romans 8 describes life in the Spirit for those who are in Christ Jesus: no condemnation, the Spirit who gives life and leads God’s children, a creation groaning for its redemption, and the Spirit’s help in weakness. It ends with God’s purpose for His people and a love in Christ from which nothing can separate them. The chapter draws on the curse that followed the fall, the promise of God’s Spirit within His people, and the psalms of the faithful who suffer for His sake."
