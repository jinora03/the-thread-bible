  note: Sample content written for the design preview; not yet theologically reviewed.
overview: "John’s prologue ([[John 1:1–18]]) presents Jesus as the eternal Word: with God in the beginning, Himself God, the One through whom all things were made, who became flesh and dwelt among us. Its opening words return to the first words of Genesis, and its language of dwelling, glory, grace and truth recalls the tabernacle and the LORD’s self-revelation to Moses. The chapter then turns to John the Baptist’s testimony that Jesus is the Lamb of God and the Son of God, and to the first disciples who follow Him."
