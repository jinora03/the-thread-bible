title: The Pierced One
passage: Zechariah 12:10
classification:
  - Zechariah
summary: The LORD promises to pour out a spirit of grace on Jerusalem, so that they look on the One they have pierced and mourn as for an only son (Zechariah 12:10). John cites the verse at the crucifixion (John 19:37), and Revelation takes it up at Christ’s coming (Revelation 1:7).
