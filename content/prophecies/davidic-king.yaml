title: A King from David’s Line
passage: 2 Samuel 7:12–16
classification:
  - 2 Samuel
  - Davidic covenant
summary: God promises David a descendant whose throne and kingdom He will establish for ever, and to whom He will be a Father (2 Samuel 7:12–16). The prophets look for this King (Isaiah 9:6–7), and the New Testament announces Jesus as the one who receives David’s throne (Luke 1:32–33; Hebrews 1:5).
