title: The Holy One Will Not See Corruption
passage: Psalms 16:8–11
classification:
  - Psalms
  - Resurrection
summary: David trusts that God will not abandon him to the grave or let His Holy One see decay (Psalm 16:10). Peter and Paul both quote the psalm and apply it to the resurrection of Jesus, since David himself died and saw decay (Acts 2:29–31; Acts 13:35–37).
