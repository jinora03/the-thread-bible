summary: After the fall, God tells the serpent that the woman’s offspring will crush its head and be struck on the heel (Genesis 3:15). Scripture later names the ancient serpent as Satan (Revelation 12:9) and speaks of his defeat through Christ (Hebrews 2:14; Romans 16:20).
