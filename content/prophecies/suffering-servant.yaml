detail:
  historicalContext:
    - The song belongs to [[Isaiah 40–55]], where the LORD speaks comfort to His people in the setting of the Babylonian exile and promises their return ([[Isaiah 40:1–2]]; [[Isaiah 48:20]]). Four Servant Songs in these chapters describe a servant of the LORD with a mission to Israel and to the nations ([[Isaiah 42:1–4]]; [[Isaiah 49:1–6]]; [[Isaiah 50:4–9]]; [[Isaiah 52:13–53:12]]).
    - In the second song the LORD calls the servant Israel ([[Isaiah 49:3]]), yet sends Him to bring Jacob back to God and to be a light for the nations ([[Isaiah 49:5–6]]). The fourth song opens and closes with the servant’s exaltation ([[Isaiah 52:13–15]]; [[Isaiah 53:10–12]]); between them He is rejected, suffers for the transgressions of others and is put to death ([[Isaiah 53:1–9]]).
  keyWording:
    - label: He bore our griefs
      reference: Isaiah 53:4
      note: The servant carries the griefs and sorrows of others, though onlookers suppose He is being struck down by God.
    - label: Wounded for our transgressions
      reference: Isaiah 53:5
      note: His wounds and punishment are for the sins of others, and through them they receive peace and healing.
    - label: The iniquity of us all
      reference: Isaiah 53:6
      note: All have strayed like sheep, each to his own way, and the LORD lays their iniquity on Him.
    - label: Despised and rejected
      reference: Isaiah 53:3
      note: The servant is despised and not esteemed by the very people He comes among.
    - label: Like a lamb led to the slaughter
      reference: Isaiah 53:7
      note: He is oppressed and afflicted yet silent, like a lamb before slaughter or a sheep before its shearers.
    - label: A guilt offering
      reference: Isaiah 53:10
      note: His life is made a guilt offering, the sacrifice for wrongdoing described in [[Leviticus 5:14–19]].
    - label: Numbered with the transgressors
      reference: Isaiah 53:12
      note: He is counted among sinners, yet bears the sin of many and intercedes for the transgressors.
