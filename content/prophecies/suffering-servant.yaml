title: The Suffering Servant
passage: Isaiah 52:13–53:12
classification:
  - Fourth Servant Song
  - Isaiah
summary: Isaiah’s fourth Servant Song portrays the servant of the LORD despised, wounded for the sins of others, and finally exalted (Isaiah 52:13–53:12). The New Testament identifies the servant as Jesus and returns to the song to explain His death (Acts 8:35; 1 Peter 2:22–25).
