    - Zechariah 12:10
  connectionsIntroduction: "The New Testament identifies the servant as Jesus: Philip begins with this passage and tells the Ethiopian official the good news about Jesus ([[Acts 8:30–35]]). Jesus applies its words to Himself on the night He is betrayed ([[Luke 22:37]]), Matthew sees it fulfilled in His healing ([[Matthew 8:17]]), and Peter reads Christ’s silence and wounds through it ([[1 Peter 2:22–25]])."
