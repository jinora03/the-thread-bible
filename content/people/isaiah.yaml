title: Isaiah
role: Prophet
summary: Isaiah son of Amoz prophesied concerning Judah and Jerusalem in the days of Uzziah, Jotham, Ahaz and Hezekiah. The New Testament quotes him often, applying his words about Immanuel and the suffering servant to Jesus, and his voice in the wilderness to John the Baptist.
