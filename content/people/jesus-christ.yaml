title: Jesus Christ
role: The Christ
summary: Jesus of Nazareth is the Word who was with God and was God, made flesh and born of David’s line. He is the Christ, the Son of the living God, who died for our sins according to the Scriptures, was raised on the third day, and is exalted as Lord.
