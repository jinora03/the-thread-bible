title: John the Baptist
role: Prophet
summary: John the Baptist was sent ahead to prepare the way of the Lord, as Isaiah 40:3 and Malachi 3:1 foretold. He called Israel to repent and be baptized, and he pointed to Jesus as the Lamb of God who takes away the sin of the world.
