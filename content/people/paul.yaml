title: Paul
role: Apostle
summary: Paul, also called Saul, was a Pharisee who persecuted the church until the risen Jesus appeared to him on the road to Damascus. He became the apostle to the Gentiles, and thirteen New Testament letters bear his name, among them Romans and 1 Corinthians.
